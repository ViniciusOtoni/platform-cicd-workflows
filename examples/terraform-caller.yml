# Exemplo: .github/workflows/terraform.yml em um repositório de infraestrutura.
name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  ci:
    if: github.event_name == 'pull_request'
    uses: ViniciusOtoni/platform-cicd-workflows/.github/workflows/ci-terraform.yml@v1
    with:
      working-directory: stacks/core
      environment-name: dev
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  cd:
    if: github.event_name == 'push'
    uses: ViniciusOtoni/platform-cicd-workflows/.github/workflows/cd-terraform.yml@v1
    with:
      working-directory: stacks/core
      environment-name: dev
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
