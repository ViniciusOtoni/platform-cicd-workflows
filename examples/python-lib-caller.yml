# Exemplo: .github/workflows/python.yml em um framework/SDK da plataforma.
name: python

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ViniciusOtoni/platform-cicd-workflows/.github/workflows/ci-python.yml@v1

  release:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ViniciusOtoni/platform-cicd-workflows/.github/workflows/cd-python-release.yml@v1

  major-tag:
    needs: release
    uses: ViniciusOtoni/platform-cicd-workflows/.github/workflows/cd-major-tag.yml@v1
