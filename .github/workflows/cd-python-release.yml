# CD de pacote Python: em uma tag vX.Y.Z, valida a versão do pyproject,
# gera o wheel e publica como asset de GitHub Release (ADR: GitHub Packages não suporta PyPI).
# Consumo: pip install "<pkg> @ https://github.com/<owner>/<repo>/releases/download/vX.Y.Z/<wheel>"
# Requer no caller: permissions { contents: write }
name: cd-python-release

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      python-version:
        type: string
        default: "3.12"
    outputs:
      wheel-url:
        value: ${{ jobs.release.outputs.wheel-url }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      wheel-url: ${{ steps.publish.outputs.wheel-url }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Exigir tag semver
        if: github.ref_type != 'tag'
        run: |
          echo "::error::cd-python-release deve rodar em push de tag vX.Y.Z"; exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Conferir versão do pyproject com a tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::pyproject.toml tem $version, mas a tag é $TAG"; exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Publicar GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.whl --title "$TAG" --generate-notes --verify-tag
          wheel=$(basename dist/*.whl)
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${wheel}"
          echo "wheel-url=$url" >> "$GITHUB_OUTPUT"
          echo "### Wheel publicado: $url" >> "$GITHUB_STEP_SUMMARY"
