# CD GitOps: atualiza a versão da imagem no repo platform-gitops.
# O Flux no AKS reconcilia a mudança; este workflow nunca acessa o cluster.
#   mode=commit        -> commit direto na branch padrão (uso: dev)
#   mode=pull-request  -> abre PR (uso: prd; aprovação humana = promoção)
# Credencial (uma das duas):
#   GITOPS_DEPLOY_KEY: chave SSH privada de uma deploy key com escrita SÓ no repo gitops (suficiente p/ mode=commit).
#   GITOPS_TOKEN:      fine-grained PAT/GitHub App com contents+pull-requests: write (obrigatório p/ mode=pull-request).
name: cd-gitops-promote

on:
  workflow_call:
    inputs:
      gitops-repository:
        type: string
        default: ViniciusOtoni/platform-gitops
      file-path:
        description: Arquivo a alterar (ex. domains/pedidos/overlays/dev/kustomization.yaml)
        type: string
        required: true
      yq-expression:
        description: Expressão yq; recebe a tag na env TAG
        type: string
        default: .spec.values.image.tag = strenv(TAG)
      tag:
        type: string
        required: true
      environment-name:
        type: string
        required: true
      mode:
        type: string
        default: commit
    secrets:
      GITOPS_TOKEN:
        required: false
      GITOPS_DEPLOY_KEY:
        required: false

jobs:
  promote:
    name: promote ${{ inputs.tag }} -> ${{ inputs.environment-name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}
    concurrency:
      group: gitops-${{ inputs.gitops-repository }}-${{ inputs.file-path }}
      cancel-in-progress: false
    steps:
      - name: Validar modo e credenciais
        env:
          MODE: ${{ inputs.mode }}
          HAS_TOKEN: ${{ secrets.GITOPS_TOKEN != '' }}
          HAS_KEY: ${{ secrets.GITOPS_DEPLOY_KEY != '' }}
        run: |
          if [ "$MODE" != "commit" ] && [ "$MODE" != "pull-request" ]; then
            echo "::error::mode deve ser 'commit' ou 'pull-request'"; exit 1
          fi
          if [ "$MODE" = "pull-request" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::mode=pull-request exige GITOPS_TOKEN"; exit 1
          fi
          if [ "$HAS_TOKEN" != "true" ] && [ "$HAS_KEY" != "true" ]; then
            echo "::error::informe GITOPS_DEPLOY_KEY ou GITOPS_TOKEN"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops-repository }}
          token: ${{ secrets.GITOPS_TOKEN || github.token }}
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops

      - name: Atualizar versão
        working-directory: gitops
        env:
          TAG: ${{ inputs.tag }}
          EXPR: ${{ inputs.yq-expression }}
          FILE: ${{ inputs.file-path }}
        run: |
          yq -i "$EXPR" "$FILE"
          git --no-pager diff

      - name: Commit / PR
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          TAG: ${{ inputs.tag }}
          ENV_NAME: ${{ inputs.environment-name }}
          FILE: ${{ inputs.file-path }}
          SOURCE_REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
        run: |
          if git diff --quiet; then
            echo "Nenhuma mudança: versão já aplicada."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="chore(${ENV_NAME}): promove ${SOURCE_REPO} para ${TAG}"
          if [ "$MODE" = "commit" ]; then
            git commit -am "$msg"
            # Outros serviços podem promover ao mesmo tempo: rebase e tenta de novo.
            for i in 1 2 3 4 5; do
              git push && exit 0
              echo "push rejeitado (tentativa $i); rebase e nova tentativa"
              git pull --rebase
            done
            exit 1
          else
            branch="promote/${ENV_NAME}/$(basename "$SOURCE_REPO")-${TAG}"
            git checkout -b "$branch"
            git commit -am "$msg"
            git push -u origin "$branch"
            gh pr create --title "$msg" \
              --body "Promoção automática de \`${SOURCE_REPO}\` para \`${TAG}\` em \`${ENV_NAME}\` (arquivo \`${FILE}\`). O merge dispara a reconciliação do Flux."
          fi
