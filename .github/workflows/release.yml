# CD deste próprio repositório: ao publicar vX.Y.Z, cria a GitHub Release e move a tag major.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes --verify-tag

  major-tag:
    uses: ./.github/workflows/cd-major-tag.yml
