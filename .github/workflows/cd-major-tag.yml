# CD de versionamento: ao publicar a tag vX.Y.Z, move a tag major (vX) para o mesmo commit.
# Permite que consumidores fixem "@v1" e recebam correções/features compatíveis.
# Requer no caller: permissions { contents: write }
name: cd-major-tag

on:
  workflow_call: {}

jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Exigir tag semver
        if: github.ref_type != 'tag'
        run: |
          echo "::error::cd-major-tag deve rodar em push de tag vX.Y.Z"; exit 1

      - uses: actions/checkout@v4

      - name: Mover tag major
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG não é semver final; nada a fazer."; exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
          echo "### $major -> $TAG" >> "$GITHUB_STEP_SUMMARY"
