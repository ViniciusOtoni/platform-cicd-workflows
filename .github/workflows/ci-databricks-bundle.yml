# CI de Databricks Asset Bundle: bundle validate no target informado (auth via OIDC -> az CLI).
# Requer no caller: permissions { contents: read, id-token: write }
name: ci-databricks-bundle

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      target:
        type: string
        default: dev
      databricks-host:
        description: URL do workspace (https://adb-xxx.azuredatabricks.net)
        type: string
        required: true
      azure-client-id:
        type: string
        required: true
      azure-tenant-id:
        type: string
        required: true
      azure-subscription-id:
        type: string
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      DATABRICKS_HOST: ${{ inputs.databricks-host }}
      DATABRICKS_AUTH_TYPE: azure-cli
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      - name: bundle validate
        run: databricks bundle validate -t "${{ inputs.target }}"
