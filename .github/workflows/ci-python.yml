# CI de pacote Python: ruff, pytest e build do wheel (artefato "dist").
name: ci-python

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      python-version:
        type: string
        default: "3.12"
      install-command:
        type: string
        default: pip install -e ".[dev]"
      test-command:
        type: string
        default: pytest -q
      build:
        description: Gera o wheel e publica como artefato "dist"
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip build ruff
          ${{ inputs.install-command }}

      - name: ruff
        run: ruff check .

      - name: Testes
        run: ${{ inputs.test-command }}

      - name: Build
        if: inputs.build
        run: python -m build --wheel

      - uses: actions/upload-artifact@v4
        if: inputs.build
        with:
          name: dist
          path: ${{ inputs.working-directory }}/dist/*.whl
          if-no-files-found: error
